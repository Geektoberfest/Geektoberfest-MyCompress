[workspace]
resolver = "2"
members = ["mycompress-core", "mycompress-cli", "mycompress-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/your-org/mycompress"

[workspace.dependencies]
mycompress-core = { path = "mycompress-core", version = "0.1.0" }

[profile.release]
lto = true
strip = true